# Opens a pull request when a GitHub Action used by the workflows, the base images in the Dockerfile,
# or the build tools in package.json have a new version (including security fixes). Merge it once the smoke test is green.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      build-tools:
        patterns: ["*"]
