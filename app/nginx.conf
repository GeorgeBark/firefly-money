# nginx's own settings for Money. The image's stock nginx.conf, plus what the sign-in needs:
# the njs module (runs app/session.js) and the two variables session.js reads.
# Also runs as any non-root user (e.g. `user: "568:568"`), so there's no `user` line and the pid file goes to /tmp.
load_module /etc/nginx/modules/ngx_http_js_module.so;

worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

# nginx hides the environment from its workers unless it's named here
env DASH_PASSWORD;
env FIREFLY_TOKEN;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
